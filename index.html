<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS System - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/lib/normalize.css">
</head>
<body>

<!--login-->
<div class="container login-container" id="login-page">
    <div class="card p-3">
        <div class="card-body">
            <h1 class="text-center mb-5" style="font-size: 3rem">LOGIN</h1>

            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="username" required>
                    <label for="username">Username</label>
                </div>

                <div class="form-floating mb-5">
                    <input type="password" class="form-control" id="password" placeholder="password" required>
                    <label for="password">Password</label>
                </div>

                <button class="btn btn-primary w-100 mb-5" type="submit">Login</button>
                <p id="login-error" class="text-danger text-center" style="display:none;">Invalid Credentials!</p>

            </form>
        </div>
    </div>
</div>

<!--navbar-->
<header class="container-fluid navbar-container" id="navbar-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary p-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#home">
                <img class="logo" src="assets/image/logo.png">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav" style="margin-left: auto;">
                    <a class="nav-link" href="#customer-container">Customer</a>
                    <a class="nav-link" href="#item-container">Item</a>
                    <a class="nav-link" href="#order-container">Order</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="script.js"></script>
</body>
</html>
