<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS System - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/lib/normalize.css">
</head>
<body>

<!--login-->
<div class="container login-container" id="login-page">
    <div class="card p-3">
        <div class="card-body">
            <h1 class="text-center mb-5" style="font-size: 3rem">LOGIN</h1>

            <form id="login-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" placeholder="username" required>
                    <label for="username">Username</label>
                </div>

                <div class="form-floating mb-5">
                    <input type="password" class="form-control" id="password" placeholder="password" required>
                    <label for="password">Password</label>
                </div>

                <button class="btn btn-primary w-100 mb-5" type="submit">Login</button>
                <p id="login-error" class="text-danger text-center mt-2" style="display:none;">Invalid credentials!</p>

            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="script.js"></script>
</body>
</html>
